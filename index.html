    <script>
        /* Configuração para lazy-load universal */
        const lazyElements = document.querySelectorAll("[data-lazy]");

        /* Observer */
        const observer = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                const el = entry.target;

                if (entry.isIntersecting) {
                    // MONTAR quando fica visível
                    if (!el.dataset.loaded) {
                        mountElement(el);
                        el.dataset.loaded = "true";
                    }
                } else {
                    // DESCARREGAR quando fica invisível
                    if (el.dataset.loaded) {
                        unmountElement(el);
                        el.dataset.loaded = "";
                    }
                }
            });
        }, {
            threshold: 0.10
        });

        /* Ativa o observer */
        lazyElements.forEach(el => observer.observe(el));


        /* ----------------------
           Função de MONTAGEM
           ---------------------- */
        function mountElement(el) {

            // Caso seja uma imagem
            if (el.dataset.src) {
                el.src = el.dataset.src;
            }

            // Caso seja um iframe
            if (el.tagName === "IFRAME" && el.dataset.src) {
                el.src = el.dataset.src;
            }

            // Se for HTML dinâmico pesado
            if (el.dataset.html) {
                el.innerHTML = el.dataset.html;
            }

            // Se tiver script embutido
            if (el.dataset.script) {
                const fn = new Function(el.dataset.script);
                fn();
            }
        }


        /* ----------------------
           Função de DESCARREGAR
           ---------------------- */
        function unmountElement(el) {

            // Remove src para liberar memória
            if (el.dataset.src) {
                el.removeAttribute("src");
            }

            // Apaga HTML gerado dinamicamente
            if (el.dataset.html) {
                el.innerHTML = "";
            }

            // Se tiver script de limpeza
            if (el.dataset.cleanup) {
                const fn = new Function(el.dataset.cleanup);
                fn();
            }
        }
        document.addEventListener("DOMContentLoaded", () => {
            const bgElement = document.querySelector(".background");
            const wallpapers = document.querySelectorAll(".setWallpaper img");

            // 1. Carregar background salvo no localStorage
            const savedBG = localStorage.getItem("selectedWallpaper");
            if (savedBG) {
                bgElement.src = savedBG;
            }

            // 2. Evento de clique para trocar o background
            wallpapers.forEach(img => {
                img.addEventListener("click", () => {
                    const newBG = img.getAttribute("data-src");

                    // Troca o background principal
                    bgElement.src = newBG;

                    // Salva no localStorage
                    localStorage.setItem("selectedWallpaper", newBG);
                });
            });
        });
        const modal = document.getElementById("conteudo");
        const botaoFechar = document.getElementById("botao");

        // Guarda as imagens internas do modal
        const modalImages = modal.querySelectorAll("img[data-src]");

        // Função para descarregar imagens
        function unloadImages() {
            modalImages.forEach(img => {
                img.removeAttribute("src"); // remove a imagem da memória
            });
        }

        // Função para recarregar imagens
        function reloadImages() {
            modalImages.forEach(img => {
                const original = img.getAttribute("data-src");
                img.src = original;
            });
        }

        // FECHAR MODAL
        botaoFechar.addEventListener("click", () => {
            unloadImages();          // descarrega as imagens
            modal.style.display = "none";
        });

        // ABRIR MODAL  (se você tiver um botão para abrir)
        const abrir = document.getElementById("abrirModal"); // coloque seu botão aqui

        if (abrir) {
            abrir.addEventListener("click", () => {
                modal.style.display = "flex";  // ou block, conforme seu layout
                reloadImages();                // recarrega quando abrir
            });
        }

        document.getElementById("abrirModal").addEventListener("click", () => {
            modal.style.display = "flex"; // ou "block", dependendo do seu CSS
        });


    </script>
    <script>
        document.addEventListener("DOMContentLoaded", () => {
            const checkbox = document.getElementById("checkboxInput");
            const clockContainer = document.getElementById("clockcontainer");

            // Recupera estado salvo
            const savedState = localStorage.getItem("clockVisible");

            if (savedState === "true") {
                checkbox.checked = true;
                clockContainer.style.display = "block";
            } else {
                clockContainer.style.display = "none";
            }

            // Escuta mudança no checkbox
            checkbox.addEventListener("change", () => {
                if (checkbox.checked) {
                    clockContainer.style.display = "block";
                    localStorage.setItem("clockVisible", "true");
                } else {
                    clockContainer.style.display = "none";
                    localStorage.setItem("clockVisible", "false");
                }

        });
